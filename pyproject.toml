[project]
name = "msu-ai-school"
version = "0.3.0"
description = "Minimal STL viewer and transparent LLM input pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cadquery>=2.5,<3",
  "httpx>=0.28,<1",
  "huggingface-hub>=0.27,<2",
  "manifold3d>=3,<4",
  "matplotlib>=3.9,<4",
  "numpy>=2,<3",
  "pillow>=10,<13",
  "plotly>=6,<7",
  "streamlit>=1.50,<2",
  "trimesh>=4.5,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mesh2cad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
