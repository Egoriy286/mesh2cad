[project]
name = "mesh2cad-repair"
version = "0.1.0"
description = "A small, reproducible mesh-to-CadQuery repair experiment"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cadquery>=2.5,<3",
  "huggingface-hub>=0.27,<2",
  "manifold3d>=3,<4",
  "matplotlib>=3.9,<4",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "trimesh>=4.5,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
workbench = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "requests>=2.32,<3",
  "streamlit>=1.66,<2",
  "uvicorn>=0.34,<1",
]

[project.scripts]
mesh2cad = "mesh2cad.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mesh2cad", "api", "frontend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
